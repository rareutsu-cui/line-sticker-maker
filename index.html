<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スタンプメーカー</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06C755">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スタンプ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>スタンプメーカー</h1></header>
<div id="iosHint" class="banner" hidden>
  Safariの「共有」ボタン →「ホーム画面に追加」で、アプリとして使えます。
  <button type="button" id="iosHintClose">閉じる</button>
</div>

<main>
  <section class="panel">
    <h2>素材</h2>
    <div class="row">
      <label class="btn">写真を選ぶ<input type="file" id="fileInput" accept="image/*" multiple hidden></label>
      <label class="btn">カメラで撮る<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden></label>
      <button type="button" id="blankBtn">白紙に描く</button>
    </div>
    <ul id="list"></ul>
  </section>

  <section class="panel editor">
    <div class="canvasWrap"><canvas id="view" width="370" height="320"></canvas></div>
    <p class="hint" id="hint"></p>

    <div class="tools">
      <button type="button" data-tool="move">移動</button>
      <button type="button" data-tool="pen">ペン</button>
      <button type="button" data-tool="erase">消しゴム</button>
      <button type="button" data-tool="lasso">なぞって切り抜き</button>
      <button type="button" data-tool="pick">背景色を選ぶ</button>
    </div>

    <div class="row">
      <label>ペンの色<input type="color" id="penColor" value="#000000"></label>
      <label>太さ<input type="range" id="penSize" min="1" max="40" value="6"></label>
    </div>
    <div class="row"><label>拡大<input type="range" id="scale" min="0.3" max="4" step="0.01" value="1"></label></div>
    <div class="row"><label>回転<input type="range" id="rot" min="-180" max="180" step="1" value="0"></label></div>
    <div class="row"><button id="clearPaint" type="button">描き込み・消し跡をリセット</button></div>

    <fieldset>
      <legend>背景の透過</legend>
      <label><input type="checkbox" id="removeBg"> 背景を透過する</label>
      <div class="row">
        <label>許容範囲<input type="range" id="tol" min="0" max="150" value="30"></label>
        <span id="swatch" class="swatch"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>テキスト</legend>
      <input type="text" id="text" placeholder="文字を入力(6文字以内が推奨)" maxlength="30">
      <div class="row">
        <label>書体
          <select id="font">
            <option value="gothic">ゴシック</option>
            <option value="maru">丸ゴシック</option>
            <option value="mincho">明朝</option>
            <option value="hand">手書き風</option>
          </select>
        </label>
        <label>サイズ<input type="range" id="textSize" min="12" max="80" value="36"></label>
        <label>色<input type="color" id="textColor" value="#000000"></label>
      </div>
    </fieldset>

    <div class="row buttons">
      <button id="mainBtn" type="button">メイン画像にする</button>
      <button id="savePng" type="button">このスタンプをPNG保存</button>
      <button id="delBtn" type="button" class="danger">削除</button>
    </div>
  </section>

  <section class="panel">
    <h2>作品情報</h2>
    <label class="block">タイトル(40文字以内)<input type="text" id="title" maxlength="40"></label>
    <label class="block">説明(200文字以内)<textarea id="desc" maxlength="200" rows="3"></textarea></label>
  </section>

  <section class="panel">
    <div class="row buttons">
      <button id="previewBtn" type="button">プレビュー・チェック</button>
      <button id="saveZip" type="button">全部ZIPで保存</button>
    </div>
  </section>

  <section id="preview" class="panel" hidden>
    <h2>プレビュー・チェック</h2>
    <div id="grid"></div>
    <ul id="checks"></ul>
    <p class="hint">※審査基準は、LINE Creators Marketの最新ガイドラインでご確認ください。</p>
    <button id="closePreview" type="button">閉じる</button>
  </section>
</main>

<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
